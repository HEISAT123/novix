server {
    listen 3000;
    location / {
        root /usr/share/nginx/html;
        index  index.html index.html;
        try_files $uri $uri/ /index.html =404;
    }
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
    }
    include /etc/nginx/mime.types;
}
