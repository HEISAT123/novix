worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Обязательно добавляем mime.types, иначе браузер заблокирует стили сайта
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Блокируем прямой IP по HTTP (порт 80)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _; # Перехватывает любой хост, кроме явно указанных ниже
        
        # Вариант 1: Просто сбрасываем соединение (код 444 — специфичный для Nginx)
        # Браузер пользователя покажет ошибку "Не удалось открыть страницу"
        return 444; 
    }

    # Блокируем прямой IP по HTTPS (порт 443)
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        # Nginx требует указать хоть какие-то сертификаты для порта 443, 
        # поэтому используем те же, что и для основного домена
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;

        return 444;
    }

    # 1. РЕДИРЕКТ С HTTP (80) НА HTTPS (443)
    server {
        listen 80;
        listen [::]:80;
        server_name novixvote.ru www.novixvote.ru; # Ваш домен

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. НАСТРОЙКА HTTPS (443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name novixvote.ru www.novixvote.ru; # Ваш домен

        # Пути к файлам сертификата внутри контейнера Nginx
        # (Они появятся здесь благодаря пробросу папки ./ssl в docker-compose)
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;

        # Базовые настройки безопасности SSL
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Проксирование на Фронтенд (React-контейнер)
        location / {
            proxy_pass http://frontend:3000; # Убрали слэш на конце для корректной работы путей
            proxy_http_version 1.1;
            
            # Настройки для поддержки WebSockets (полезно для live-обновлений)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Передача реальных заголовков клиента (IP-адресов) внутрь сети Docker
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache_bypass $http_upgrade;
        }

        # Проксирование на Бэкенд API
        location /api/ {
            proxy_pass http://backend:8000/; # Слэш на конце обязателен, чтобы отсекать "/api/" при передаче в бэкенд
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}