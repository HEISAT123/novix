networks:
  dev:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-survey_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-survey_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    networks:
      - dev
  nginx:
    image: nginx:stable-alpine
    ports:
    - "80:80"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    depends_on:
    - backend
    - frontend
    networks:
    - dev

volumes:
  postgres_data:
